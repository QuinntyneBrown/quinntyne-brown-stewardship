<qbs-skip-link target="#main" />
<qbs-programme-header
  [links]="links"
  [pending]="pending()"
  (signOut)="signOut()"
/>
<main id="main" tabindex="-1">
  @if (error()) {
    <qbs-error-message [message]="error()" />
  }
  <qbs-enrollment-status [description]="description()" (expired)="expired()" />
</main>
