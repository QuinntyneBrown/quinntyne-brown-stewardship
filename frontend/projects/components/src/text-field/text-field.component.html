<label [attr.for]="name()">{{ label() }}</label
><span class="field"
  ><input
    #control
    [attr.id]="name()"
    [attr.name]="name()"
    [attr.type]="type()"
    [attr.autocomplete]="autocomplete()"
    required
    [attr.maxlength]="maxLength()"
    [value]="value()"
    (input)="value.set(control.value)"
    [attr.aria-invalid]="!!error()"
    [attr.aria-describedby]="error() ? errorId() : null"
  />@if (showCount()) {
    <span class="count muted" aria-hidden="true">{{ length() }} / {{ maxLength() }}</span>
  }</span
>
@if (error()) {
  <p [attr.id]="errorId()" class="error" role="alert">{{ error() }}</p>
}
