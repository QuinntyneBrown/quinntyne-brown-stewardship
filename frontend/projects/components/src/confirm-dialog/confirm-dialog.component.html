<dialog #dialog aria-labelledby="confirm-title" (cancel)="cancelled($event)">
  <div class="stack">
    <h2 id="confirm-title">{{ heading() }}</h2>
    <p>{{ consequence() }}</p>
    <div class="actions">
      <button type="button" autofocus (click)="decide(false)">{{ keepLabel() }}</button>
      <button type="button" class="secondary" (click)="decide(true)">{{ confirmLabel() }}</button>
    </div>
  </div>
</dialog>
