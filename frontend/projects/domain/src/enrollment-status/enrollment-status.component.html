@if (status() === "loading") {
  <qbs-status-message message="Checking your enrollment…" />
} @else if (status() === "error") {
  <qbs-retry-notice
    message="We could not check your enrollment. Please try again."
    (retry)="load()"
  />
} @else if (!enrollment()?.isEnrolled) {
  <qbs-not-enrolled-notice [description]="description()" />
} @else {
  <qbs-cohort-summary
    [mentorName]="enrollment()?.mentorName ?? null"
    [startDate]="enrollment()?.startDate ?? null"
  />
}
