<div class="stack reading-column"><p class="eyebrow">A record of attention</p><h1>What you have written</h1>
<p class="lead">Keep the questions, observations and decisions that deserve another look. Your notes are shared only with your assigned mentor.</p>
<a class="button" routerLink="/notes/new" [queryParams]="{ moduleId: moduleId(), sessionId: sessionId() }">Write a note</a>
@if (moduleId() || sessionId()) { <a class="action-link" routerLink="/notes">Show all notes</a> }
@if (error()) { <qbs-retry-notice [message]="error()" (retry)="load()" /> }
@else if (data(); as data) {
  <qbs-note-collection [initialNotes]="data.notes" [initialCursor]="data.nextCursor" [moduleId]="moduleId()" [sessionId]="sessionId()" (expired)="expired.emit()" />
} @else { <qbs-status-message message="Loading your notes…" /> }
</div>
