name: Bug report
description: Report something that does not work as documented
title: "[Bug]: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report.

        **Do not use this form for security vulnerabilities.** Follow
        [SECURITY.md](https://github.com/QuinntyneBrown/quinntyne-brown-stewardship/blob/main/SECURITY.md)
        instead, so the issue stays private until a fix is published.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and did not find this one.
          required: true
        - label: This is not a security vulnerability.
          required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: Cancelling a booking more than 24 hours ahead should release the slot.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      placeholder: The slot stayed unavailable and the session allowance was not returned.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact commands you ran and what you clicked, in order.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where does the problem appear?
      options:
        - API (backend)
        - Web application (frontend)
        - Design system
        - Administration CLI
        - Build or tests
        - Documentation
        - Not sure
    validations:
      required: true

  - type: input
    id: dotnet
    attributes:
      label: .NET SDK version
      description: Output of `dotnet --version`
      placeholder: 10.0.101
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`
      placeholder: v22.21.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2 / Ubuntu 24.04 / macOS 15
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit or version
      description: Output of `git rev-parse --short HEAD`
      placeholder: 8cd8cb0
    validations:
      required: true

  - type: input
    id: correlation
    attributes:
      label: Correlation identifier
      description: >
        If the API returned an error, paste the correlation identifier from the
        response. It lets us find the matching server log entry.
      placeholder: 3f2a1c8e-...

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: >
        Command output, server log lines, or browser console errors. This is
        rendered as a code block, so no backticks are needed.
      render: text
