<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stewardship — Account menu</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,200..500;1,6..72,200..400&display=swap">
  <style>
    body { margin: 0; background: #14120F; color: #F2EDE3; font-family: Karla, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #E0A458; text-decoration: none; }
    a:hover { color: #EFC189; }
    body { padding: 40px 20px; }
  </style>
</head>
<body>
<div style="margin: 0 auto; width: 1440px; height: 900px; background: #14120F; color: #F2EDE3; font-family: Karla, system-ui, sans-serif; display: flex; flex-direction: column;">
  <header style="height: 76px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 96px; border-bottom: 1px solid #2C2822;">
    <div style="display: flex; align-items: baseline; gap: 16px;">
      <span style="font-family: Newsreader, Georgia, serif; font-size: 22px; font-weight: 400; color: #F2EDE3;">Stewardship</span>
      <span style="font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #8C8477;">Quinntyne Brown</span>
    </div>
    <nav style="display: flex; align-items: center; gap: 40px;">
      <span style="display: inline-flex; align-items: center; height: 44px; font-size: 14px; color: #F2EDE3; border-bottom: 1px solid #E0A458;">Curriculum</span>
      <span style="display: inline-flex; align-items: center; height: 44px; font-size: 14px; color: #A69E8F;">Sessions</span>
      <span style="display: inline-flex; align-items: center; height: 44px; font-size: 14px; color: #A69E8F;">Notes</span>
    </nav>
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
      <div style="width: 36px; height: 36px; border-radius: 50%; border: 1px solid #2C2822; display: flex; align-items: center; justify-content: center; color: #A69E8F; box-shadow: 0 0 0 2px #14120F, 0 0 0 4px #F2EDE3;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
    </div>
  </header>
  <main style="position: relative; flex: 1; padding: 88px 96px 0;">

    <div style="position: absolute; top: -8px; right: 96px; width: 240px; border: 1px solid #2C2822; border-radius: 4px; background: #1A1713; padding: 8px;">
      <div style="padding: 10px 14px 12px;">
        <span style="font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #8C8477;">Signed in as</span>
        <div style="margin-top: 6px; font-size: 13px; color: #C9C2B4; overflow: hidden; text-overflow: ellipsis;">participant@example.com</div>
      </div>
      <div style="height: 1px; background: #2C2822;"></div>
      <div style="display: flex; align-items: center; height: 44px; padding: 0 14px; margin-top: 4px; border-radius: 3px; font-size: 14px; color: #C9C2B4; box-shadow: 0 0 0 2px #14120F, 0 0 0 4px #F2EDE3;">Sign out</div>
    </div>

    <div style="max-width: 620px;">
      <span style="font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #8C8477;">Week three of twelve</span>
      <h1 style="margin: 20px 0 0; font-family: Newsreader, Georgia, serif; font-weight: 300; font-size: 60px; line-height: 1.06; letter-spacing: -0.015em; color: #F2EDE3; text-wrap: pretty;">The cost of what we build</h1>
      <p style="margin: 30px 0 0; max-width: 560px; font-family: Newsreader, Georgia, serif; font-size: 20px; line-height: 1.68; color: #D3CCBE; text-wrap: pretty;">Signing out ends this session on this device only. Anywhere else you are signed in stays signed in.</p>
    </div>

  </main>

</div>
</body>
</html>
